version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: security_signals_postgres
    environment:
      POSTGRES_USER: securitysignals
      POSTGRES_PASSWORD: securitysignals
      POSTGRES_DB: security_signals
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securitysignals"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security_signals_backend
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql://securitysignals:securitysignals@postgres:5432/security_signals
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # The Dockerfile's final stage is nginx:alpine (for production-style
      # builds), which has no Node/npm - `command: npm run dev` below would
      # fail against it. Target the Node-based builder stage instead for
      # local development.
      target: builder
    container_name: security_signals_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev

volumes:
  postgres_data:
